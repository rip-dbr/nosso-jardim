function createScenery(){const extra=el('div','scenery-extra');extra.innerHTML='<svg class="distant-trees" viewBox="0 0 400 260" preserveAspectRatio="none"><path d="M40 260 V110 M165 260 V80 M320 260 V120" stroke="#718b80" stroke-width="12"/><g fill="#92aaa0"><circle cx="40" cy="100" r="65"/><circle cx="165" cy="70" r="85"/><circle cx="320" cy="110" r="75"/></g></svg><svg class="river-glow" viewBox="0 0 400 160" preserveAspectRatio="none"><path d="M220 0 Q60 50 250 85 T130 160 H250 Q420 100 270 72 T280 0Z" fill="#b7cbd1"/><path d="M214 20 L257 25 M210 69 L251 73 M249 115 L290 120" stroke="#fff5d377" fill="none" stroke-width="2"/></svg>';document.querySelector('.world').append(extra);DISCOVERIES.forEach(d=>{const b=button('',()=>discover(d,b),'spot spot-'+d.id);b.setAttribute('aria-label',d.label);b.setAttribute('aria-pressed','false');b.dataset.discovery=d.id;b.innerHTML=d.id==='flower'?flowerSVG:ICONS[d.id];if(d.id==='flower')b.classList.add('bloomed');$('spots').append(b)})}
function startExploration(){placeHiddenCupid();exploring=true;document.querySelector('.experience').classList.add('is-exploring');document.body.classList.add('exploring-world','night-mode');$('exploration').hidden=false;$('back').hidden=true;$('progress').hidden=true;updateFound();$('hint').focus({preventScroll:true});$('announce').textContent='Explore o cenário tocando na lua, nas nuvens e nos detalhes do jardim.'}
function endExploration(){exploring=false;closeDiscovery();document.querySelector('.experience').classList.remove('is-exploring');document.body.classList.remove('exploring-world');$('exploration').hidden=true;$('progress').hidden=false;render();$('stage').querySelector('h1')?.focus({preventScroll:true})}
function updateFound(){$('foundCount').textContent=found.size+' de '+DISCOVERIES.length+' bilhetes encontrados';$('hint').textContent=found.size===DISCOVERIES.length?'Você achou todos':'Uma pista'}
function discover(d,b){found.add(d.id);b.classList.add('found');b.setAttribute('aria-pressed','true');updateFound();showDiscovery(d.title,d.text,found.size===DISCOVERIES.length?'Você encontrou os sete bilhetes. Pode continuar por aqui.':'',b);burst({currentTarget:b});if(found.size===DISCOVERIES.length&&!completionShown){completionShown=true;const glow=el('div','celebration-light');document.body.append(glow);setTimeout(()=>glow.remove(),2200)}}
function showDiscovery(title,text,extra='',origin=null){returnFocus=origin||document.activeElement;$('discoveryTag').textContent='achados do jardim';$('discoveryTitle').textContent=title;$('discoveryText').textContent=text;$('discoveryExtra').textContent=extra;$('keepExploring').textContent=exploring?'Continuar explorando':'Voltar ao presente';$('discovery').hidden=false;document.querySelector('.experience').inert=true;$('exploration').inert=true;$('cupido').inert=true;$('closeDiscovery').focus({preventScroll:true})}
function closeDiscovery(){if($('discovery').hidden)return;$('discovery').hidden=true;document.querySelector('.experience').inert=false;$('exploration').inert=false;$('cupido').inert=false;returnFocus?.focus({preventScroll:true})}
$('closeDiscovery').onclick=closeDiscovery;$('keepExploring').onclick=closeDiscovery;$('discovery').onclick=e=>{if(e.target===$('discovery'))closeDiscovery()};$('exploreBack').onclick=endExploration;
$('hint').onclick=()=>{const next=DISCOVERIES.find(d=>!found.has(d.id));if(!next){showDiscovery('Você encontrou todos.','Pode revisitar os bilhetes ou voltar pro álbum. Esse lugar continua seu.','',$('hint'));return}const spot=document.querySelector('[data-discovery="'+next.id+'"]');spot.classList.remove('hinted');requestAnimationFrame(()=>spot.classList.add('hinted'));spot.focus({preventScroll:true});$('announce').textContent='Pista: '+next.label.toLowerCase()};
$('cupidoImage').onerror=()=>{$('cupidoImage').hidden=true;$('cupidoFallback').hidden=false};
$('cupido').onclick=()=>{secretFound=true;showDiscovery('Você achou o responsável.','MAIOR CUPIDO DE CAICO NO NORDESTE, AJUDANO U PARCERO','Achado extra. Esse nem estava na conta.',$('cupido'))};
function placeHiddenCupid(){
 const b=$('cupido'), small=innerWidth<=620;
 const w=small?20:25, margin=small?5:8;
 const left=Math.random()<.5;
 b.style.left=left?margin+'px':'auto';
 b.style.right=left?'auto':margin+'px';
 // Laterais externas, evitando rodapé, controles e o centro da tela.
 const bands=[.12,.22,.38,.52,.66];
 const fraction=bands[Math.floor(Math.random()*bands.length)];
 b.style.top=Math.max(38,Math.min(innerHeight-110,innerHeight*fraction))+'px';
}
addEventListener('resize',()=>{if(gateOpened)placeHiddenCupid()});
function enterGift(withMusic){placeHiddenCupid();if(gateOpened)return;gateOpened=true;if(withMusic)void startMusic();$('entryGate').classList.add('opened');document.querySelector('.experience').inert=false;$('cupido').hidden=false;setTimeout(()=>{$('entryGate').hidden=true;$('stage').querySelector('h1')?.focus({preventScroll:true})},reduce?0:900)}
$('discover').onclick=()=>enterGift(true);$('silentEntry').onclick=()=>enterGift(false);$('entryGate').onclick=e=>{if(!e.target.closest('button'))enterGift(true)};
document.addEventListener('keydown',e=>{const gate=!$('entryGate').hidden&&!gateOpened;const modal=!$('discovery').hidden;if(!gate&&!modal)return;if(e.key==='Escape'&&modal){e.preventDefault();closeDiscovery();return}if(e.key==='Tab'){const buttons=gate?[$('discover'),$('silentEntry')]:[$('closeDiscovery'),$('keepExploring')];const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
createScenery();document.querySelector('.experience').inert=true;$('discover').focus({preventScroll:true});

</script></body></html>
