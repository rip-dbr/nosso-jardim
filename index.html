card.append(button('Rever o álbum',()=>{letterPage=0;go(0)},'text-button'));

const status=el('p','small');status.id='offlineStatus';status.setAttribute('role','status');card.append(status)}

$('stage').replaceChildren(card);$('back').hidden=index===0;$('progress').replaceChildren();screens.forEach((_,n)=>$('progress').append(el('i','dot'+(n===index?' current':''))));$('announce').textContent=s.title;if(s.kind==='anniversary'){updateClock();clockTimer=setInterval(updateClock,1000)}return card}
function elapsed(now=Date.now()){const start=Date.parse(CONTENT.startedAt);if(!Number.isFinite(start))return null;const total=Math.max(0,Math.floor((now-start)/1000));return {days:Math.floor(total/86400),hours:Math.floor(total/3600)%24,minutes:Math.floor(total/60)%60,seconds:total%60,totalHours:Math.floor(total/3600),future:now<start}}
function updateClock(){const clock=$('clock');if(!clock)return;const t=elapsed();clock.replaceChildren();if(!t){clock.textContent='Confira a data de início.';return}const units=clockHours?[[t.totalHours,'horas'],[t.minutes,'min'],[t.seconds,'seg']]:[[t.days,'dias'],[t.hours,'horas'],[t.minutes,'min'],[t.seconds,'seg']];units.forEach(([value,label])=>{const unit=el('div','clock-unit');unit.append(el('strong',null,String(value).padStart(2,'0')),el('span',null,label));clock.append(unit)});clock.setAttribute('aria-label',units.map(([v,l])=>v+' '+l).join(', ')+(t.future?' · ainda não começou':''))}
function paginate(text,paper,card){const pages=[];const max=Math.max(95,Math.min(250,$('stage').clientHeight-card.scrollHeight+paper.clientHeight-30));for(const paragraph of text.split(/\n\s*\n/).filter(p=>p.trim())){let page='';for(const word of paragraph.trim().split(/\s+/)){const next=page?page+' '+word:word;paper.firstChild.textContent=next;if(paper.scrollHeight>max&&page){pages.push(page);page=word}else page=next}if(page)pages.push(page)}paper.firstChild.textContent='';return pages.length?pages:['']}

function go(n){if(busy||n<0||n>=screens.length)return;busy=true;const old=$('stage').firstChild;if(old)old.classList.add('out');setTimeout(()=>{index=n;const card=render(),h=card.querySelector('h1');if(h)h.focus({preventScroll:true});busy=false},reduce?0:260)}$('back').onclick=()=>go(index-1);
function burst(e){if(reduce)return;const r=e.currentTarget.getBoundingClientRect();for(let n=0;n<10;n++){const p=el('i','burst');p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';p.style.setProperty('--dx',Math.cos(n*.628)*75+'px');p.style.setProperty('--dy',Math.sin(n*.628)*65+'px');p.style.background=n%2?'#dfc483':'#dec2ca';document.body.append(p);setTimeout(()=>p.remove(),850)}}
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!reduce){let frame=0;document.addEventListener('pointermove',e=>{if(frame)return;frame=requestAnimationFrame(()=>{document.documentElement.style.setProperty('--x',((e.clientX/innerWidth-.5)*16)+'px');document.documentElement.style.setProperty('--y',((e.clientY/innerHeight-.5)*12)+'px');frame=0})})}let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{letterDirty=true;if(index===letterIndex)render()},180)});
let audio=null,playing=false,audioAttempt=0,musicContext=null,musicGain=null;
function softenMusic(){if(musicContext)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{musicContext=new AC();const source=musicContext.createMediaElementSource(audio);musicGain=musicContext.createGain();musicGain.gain.value=.12;source.connect(musicGain);musicGain.connect(musicContext.destination);audio.volume=1}catch{musicContext=null;audio.volume=.12}}
function prepareAudio(){if(audio)return audio;audio=new Audio(CONTENT.musicFile);audio.volume=.12;audio.loop=true;audio.preload='auto';audio.setAttribute('playsinline','');audio.addEventListener('pause',()=>{playing=false;updateMusicButton()});audio.addEventListener('ended',()=>{playing=false;updateMusicButton()});audio.addEventListener('error',()=>{playing=false;updateMusicButton();$('announce').textContent='O áudio ainda não está disponível. Você pode continuar sem som.'});return audio}
function updateMusicButton(){const b=$('music');b.textContent=playing?'Ⅱ Pausar música':'♫ Ouvir música';b.setAttribute('aria-pressed',String(playing));b.setAttribute('aria-label',playing?'Pausar música':'Ouvir Bobby Chase — Missing Someone')}
async function startMusic(){const attempt=++audioAttempt;try{const player=prepareAudio();softenMusic();if(musicContext)void musicContext.resume().catch(()=>{});const promise=player.play();if(promise)await promise;if(attempt!==audioAttempt)return false;playing=!player.paused;updateMusicButton();return playing}catch{if(attempt===audioAttempt){playing=false;updateMusicButton();$('announce').textContent='A música não iniciou. Você pode tentar pelo botão de som.'}return false}}
function stopMusic(){audioAttempt++;if(audio)audio.pause();playing=false;updateMusicButton()}
$('music').onclick=()=>{if(playing)stopMusic();else void startMusic()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMusic();document.querySelectorAll('.world *, .cupido, .spot svg').forEach(e=>e.style.animationPlayState='paused')}else document.querySelectorAll('.world *, .cupido, .spot svg').forEach(e=>e.style.animationPlayState='')});

async function saveOffline(e){const b=e.currentTarget,status=$('offlineStatus');b.disabled=true;status.textContent='Guardando o jardim neste aparelho…';try{if(!('serviceWorker'in navigator))throw Error();const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});const worker=reg.active||reg.waiting||reg.installing;if(!worker)throw Error();await new Promise((resolve,reject)=>{const channel=new MessageChannel(),t=setTimeout(()=>reject(Error()),15000);channel.port1.onmessage=event=>{clearTimeout(t);event.data.ok?resolve():reject(Error())};worker.postMessage({type:'CACHE_GARDEN'},[channel.port2])});status.textContent='Cópia preparada. Adicione à Tela de Início e teste abrir em modo avião antes de entregar.'}catch{status.textContent='Não foi possível guardar offline. Abra pelo Safari com internet e tente novamente.'}finally{b.disabled=false}}
render();

let secretFound=false,returnFocus=null,gateOpened=false;
function createScenery(){const extra=el('div','scenery-extra');extra.innerHTML='<svg class="distant-trees" viewBox="0 0 400 260" preserveAspectRatio="none"><path d="M40 260 V110 M165 260 V80 M320 260 V120" stroke="#718b80" stroke-width="12"/><g fill="#92aaa0"><circle cx="40" cy="100" r="65"/><circle cx="165" cy="70" r="85"/><circle cx="320" cy="110" r="75"/></g></svg><svg class="river-glow" viewBox="0 0 400 160" preserveAspectRatio="none"><path d="M220 0 Q60 50 250 85 T130 160 H250 Q420 100 270 72 T280 0Z" fill="#b7cbd1"/></svg>';document.querySelector('.world').append(extra)}
function showDiscovery(title,text,extra='',origin=null){returnFocus=origin||document.activeElement;$('discoveryTag').textContent='achados do jardim';$('discoveryTitle').textContent=title;$('discoveryText').textContent=text;$('discoveryExtra').textContent=extra;$('keepExploring').textContent='Voltar ao presente';$('discovery').hidden=false;document.querySelector('.experience').inert=true;$('cupido').inert=true;$('closeDiscovery').focus({preventScroll:true})}
function closeDiscovery(){if($('discovery').hidden)return;$('discovery').hidden=true;document.querySelector('.experience').inert=false;$('cupido').inert=false;returnFocus?.focus({preventScroll:true})}
$('closeDiscovery').onclick=closeDiscovery;$('keepExploring').onclick=closeDiscovery;$('discovery').onclick=e=>{if(e.target===$('discovery'))closeDiscovery()};
$('cupidoImage').onerror=()=>{$('cupidoImage').hidden=true;$('cupidoFallback').hidden=false};
$('cupido').onclick=()=>{secretFound=true;showDiscovery('Você achou o responsável.','MAIOR CUPIDO DE CAICO NO NORDESTE, AJUDANO U PARCERO','Achado extra. Esse nem estava na conta.',$('cupido'))};
function placeHiddenCupid(){
 const b=$('cupido'), small=innerWidth<=620;
 const w=small?20:25, margin=small?5:8;
 const left=Math.random()<.5;
 b.style.left=left?margin+'px':'auto';
 b.style.right=left?'auto':margin+'px';
 // Laterais externas, evitando rodapé, controles e o centro da tela.
 const bands=[.12,.22,.38,.52,.66];
 const fraction=bands[Math.floor(Math.random()*bands.length)];
 b.style.top=Math.max(38,Math.min(innerHeight-110,innerHeight*fraction))+'px';
}
addEventListener('resize',()=>{if(gateOpened)placeHiddenCupid()});
function enterGift(withMusic){placeHiddenCupid();if(gateOpened)return;gateOpened=true;if(withMusic)void startMusic();$('entryGate').classList.add('opened');document.querySelector('.experience').inert=false;$('cupido').hidden=false;setTimeout(()=>{$('entryGate').hidden=true;$('stage').querySelector('h1')?.focus({preventScroll:true})},reduce?0:900)}
$('discover').onclick=()=>enterGift(true);$('entryGate').onclick=e=>{if(!e.target.closest('button'))enterGift(true)};
document.addEventListener('keydown',e=>{const gate=!$('entryGate').hidden&&!gateOpened;const modal=!$('discovery').hidden;if(!gate&&!modal)return;if(e.key==='Escape'&&modal){e.preventDefault();closeDiscovery();return}if(e.key==='Tab'){const buttons=gate?[$('discover')]:[$('closeDiscovery'),$('keepExploring')];const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
createScenery();document.querySelector('.experience').inert=true;$('discover').focus({preventScroll:true});

</script></body></html>
